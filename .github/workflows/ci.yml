
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Глобальные переменные окружения
env:
  PORT: "8000"
  PROVIDER: "mock-provider"
  LLM_MODEL: "mock-model"

jobs:

  # =====================================================
  # 1. BUILD PYTHON PACKAGES
  # =====================================================
  build-packages:
    name: Build Python packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Используем существующие скрипты.
      # Docker на этом этапе не собираем.
      - name: Build all Python packages
        env:
          SKIP_DOCKER: "1"
        run: |
          bash scripts/build_contract.sh
          bash scripts/build_observability.sh
          bash scripts/build_orchestrator.sh
          bash scripts/build_researcher.sh
          bash scripts/build_llm.sh
          bash scripts/build_analyst.sh
          bash scripts/build_director.sh
          bash scripts/build_finalizer.sh

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: packages/*.whl
          if-no-files-found: error
          retention-days: 1


  # =====================================================
  # 2. UNIT TESTS
  # =====================================================
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: packages/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Install locally built packages
        run: |
          pip install packages/*.whl

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v


  # =====================================================
  # 3. INTEGRATION TESTS
  # =====================================================
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build-packages, unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: packages/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Install locally built packages
        run: |
          pip install packages/*.whl

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v


  # =====================================================
  # 4. E2E + LOAD SMOKE
  # =====================================================
  e2e-and-load:
    name: E2E and Load Smoke Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    env:
      ORCHESTRATOR_HOST_PORT: "8000"
      DIRECTOR_SERVICE_URL: "http://0.0.0.0:9000"
      RESEARCHER_SERVICE_URL: "http://0.0.0.0:9000"
      ANALYST_SERVICE_URL: "http://0.0.0.0:9000"
      FINALIZER_SERVICE_URL: "http://0.0.0.0:9000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: packages/

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx locust

      - name: Install locally built packages
        run: |
          pip install -r requirements.txt
          pip install packages/*.whl

      # Создаем окружение
      - name: Create environment files
        run: |
          echo "ORCHESTRATOR_HOST_PORT=8000" >> .env
          echo "PORT=8000" >> .env
          echo "PROVIDER=mock-provider" >> .env
          echo "LLM_MODEL=mock-model" >> .env

          mkdir -p rag-platform-orchestrator
          echo "PORT=8000" >> ./rag-platform-orchestrator/.env

      # Собираем собственные образы из текущего исходного кода
      - name: Build and start services
        run: |
          docker compose -f docker-compose.ci.yml up -d --build

      - name: Show running containers
        run: |
          docker compose -f docker-compose.ci.yml ps

      # Ждем готовности оркестратора
      - name: Wait for Orchestrator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Orchestrator is healthy and ready!"
              exit 0
            fi

            echo "Waiting for orchestrator..."
            sleep 2
          done

          echo "Orchestrator did not become healthy in time"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      # E2E
      - name: Run E2E smoke tests
        run: |
          pytest tests/e2e/orchestrator/smoke/ -v

      # Load testing
      - name: Run Locust Smoke Test
        run: |
          locust \
            -f tests/load/orchestrator/locustfile.py \
            --host http://localhost:8000 \
            --headless \
            -u 10 \
            -r 2 \
            --run-time 1m \
            --exit-code-on-error 1

      # Логи при ошибке
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --no-color

      # Всегда останавливаем контейнеры
      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
