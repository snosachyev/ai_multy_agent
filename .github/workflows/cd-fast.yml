name: CD Fast (Pre-built Images)

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'deploy.sh'
  workflow_dispatch: # Запуск вручную кнопкой во вкладке Actions

jobs:
  deploy-fast:
    name: Fast Deploy to K8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes Context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Manifests and Restart Pods
        run: |
          chmod +x deploy.sh
          ./deploy.sh prod
          # Перезапускаем поды, чтобы кластер подтянул свежие :latest образы из GHCR
          kubectl rollout restart deployment rag-orchestrator rag-director rag-researcher rag-analyst rag-finalizer
          kubectl rollout status deployment/rag-orchestrator --timeout=180s
