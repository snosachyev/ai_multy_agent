[pytest]
env_files =
    .env
env =
    DATA_DIR=data
    DIRECTOR_SERVICE_URL=http://0.0.0.0:9000
    RESEARCHER_SERVICE_URL=http://0.0.0.0:9000
    ANALYST_SERVICE_URL=http://0.0.0.0:9000
    FINALIZER_SERVICE_URL=http://0.0.0.0:9000
markers =
    unit: изолированные тесты с моками (не требуют докера и тяжелых либ)
    integration: тесты, которые делают реальные запросы в контейнеры докера
    e2e:  тесты, которые делают реальные запросы в api http