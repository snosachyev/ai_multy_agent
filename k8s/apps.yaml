# --- ORCHESTRATOR ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: ghcr.io/snosachyev/rag-platform-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: rag-config
        command: ["sh", "-c", "uvicorn rag_platform_orchestrator.main:app --host 0.0.0.0 --port 8000"]
---
apiVersion: v1
kind: Service
metadata:
  name: rag-orchestrator
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  selector:
    app: orchestrator
---
# --- RESEARCHER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: researcher
  template:
    metadata:
      labels:
        app: researcher
    spec:
      containers:
      - name: researcher
        image: ghcr.io/snosachyev/rag-researcher:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: rag-config
        command: ["sh", "-c", "uvicorn rag_platform_researcher.main:app --host 0.0.0.0 --port 8000"]
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: rag-storage
          mountPath: /data
          subPath: data
        - name: rag-storage
          mountPath: /root/.cache/huggingface
          subPath: huggingface
      volumes:
      - name: rag-storage
        persistentVolumeClaim:
          claimName: rag-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rag-researcher
spec:
  ports:
  - port: 8002
    targetPort: 8000
  selector:
    app: researcher
---
