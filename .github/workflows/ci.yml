name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, observability, orchestrator]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Способ 1: Сборка пакетов (если ваши тесты зависят от скомпилированных whl)
      - name: Install build tools & Build
        run: |
          pip install build
          python -m build rag-platform-${{ matrix.package }}
          pip install rag-platform-${{ matrix.package }}/dist/*.whl

      # Способ 2: Установка ВСЕХ зависимостей из вашего файла (как локально)
      - name: Install local requirements.txt
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests # Запускаются только после успешных unit-тестов
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Для интеграционных тестов собираем ВСЕ три пакета, так как они могут взаимодействовать
      - name: Install build tools & Build all packages
        run: |
          pip install build
          python -m build rag-platform-contracts
          python -m build rag-platform-observability
          python -m build rag-platform-orchestrator
          pip install rag-platform-contracts/dist/*.whl
          pip install rag-platform-observability/dist/*.whl
          pip install rag-platform-orchestrator/dist/*.whl

      # Устанавливаем ваш локальный requirements.txt, чтобы подтянулись все pydantic-settings, httpx и т.д.
      - name: Install local requirements.txt
        run: |
          pip install -r requirements.txt

      # Запуск интеграционных тестов
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v


  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx build

      - name: Build contracts
        run: |
          cd rag-platform-contracts
          python -m build
          cd ..
          cp rag-platform-contracts/dist/*.whl packages/

      - name: Build network
        run: |
          docker network create rag-network || true

      - name: Start orchestrator with fake agents
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            up -d \
            --build \
            orchestrator \
            fake-agents

      - name: Show services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            ps

      - name: Wait for orchestrator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Orchestrator did not become healthy"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            logs

          exit 1

      - name: Install application packages
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install ./rag-platform-orchestrator

      - name: Run E2E smoke
        run: |
          pytest tests/e2e/orchestrator/smoke/ -v

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            logs --no-color

      - name: Stop services
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            down -v