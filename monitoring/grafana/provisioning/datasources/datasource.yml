apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL
    type: postgres
    access: proxy

    url: postgres:5432

    database: rag_evaluation
    user: rag
    secureJsonData:
      password: rag

    jsonData:
      sslmode: disable