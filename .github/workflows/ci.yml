name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# 1. ОБЪЯВЛЯЕМ ОДИН РАЗ НА ВЕСЬ ФАЙЛ
# Эти переменные автоматически попадут во все джобы (unit, integration, e2e)
env:
  PORT: "8000"
  PROVIDER: "mock-provider"
  LLM_MODEL: "mock-model"

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build
        run: |
          pip install build

      - name: Build contracts
        run: |
          python -m build rag-platform-contracts

      - name: Build observability
        run: |
          python -m build rag-platform-observability

      - name: Build orchestrator
        run: |
          python -m build rag-platform-orchestrator

      - name: Install contracts
        run: |
          pip install rag-platform-contracts/dist/*.whl

      - name: Install observability
        run: |
          pip install rag-platform-observability/dist/*.whl

      - name: Install orchestrator
        run: |
          pip install rag-platform-orchestrator/dist/*.whl

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio anyio httpx

      # 3. Устанавливаем все внешние библиотеки (pydantic-settings, pytest, httpx и др.) из общего файла
      - name: Install project and test dependencies
        run: |
          pip install -r requirements.txt


      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v


  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx

      - name: Build contracts
        run: |
          pip install build
          cd rag-platform-contracts
          python -m build
          cd ..
          cp rag-platform-contracts/dist/*.whl packages/

      - name: Install packages
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install packages/rag_platform_orchestrator-*.whl
          pip install ./rag-platform-researcher
      
      # 3. Устанавливаем все внешние библиотеки (pydantic-settings, pytest, httpx и др.) из общего файла
      - name: Install project and test dependencies
        run: |
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v


  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: unit-tests # Или integration-tests, если e2e должны идти после них

    # Объявляем порты по умолчанию для переменных в docker-compose.ci.yml
    env:
      ORCHESTRATOR_HOST_PORT: "8000"
      PORT: "8000"
      PROVIDER: "mock-provider"
      LLM_MODEL: "mock-model"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx build

      # 1. Подготавливаем .whl пакеты, которые fake-agents будут ставить внутри себя
      - name: Build local packages for mock container
        run: |
          # Создаем папку packages, если её нет
          mkdir -p packages
          
          # Собираем contracts и копируем в packages/
          python -m build rag-platform-contracts
          cp rag-platform-contracts/dist/*.whl packages/
          
          # Собираем observability (если fake-agents их тоже используют, раскомментируйте строку в docker-compose)
          python -m build rag-platform-observability
          cp rag-platform-observability/dist/*.whl packages/

      # 2. Создаем файлы .env, так как ваш docker-compose.ci.yml на них ссылается через env_file
      - name: Create environment files
        run: |
          echo "ORCHESTRATOR_HOST_PORT=8000" >> .env
          echo "PORT=8000" >> .env
          echo "PROVIDER=mock-provider" >> .env
          echo "LLM_MODEL=mock-model" >> .env
          
          # Создаем .env для самого оркестратора, если это необходимо
          mkdir -p rag-platform-orchestrator
          echo "PORT=8000" >> ./rag-platform-orchestrator/.env

      # 3. Поднимаем инфраструктуру через ваш docker-compose.ci.yml
      # Флаг --build заставит Docker собрать rag-orchestrator:latest на лету
      - name: Start Orchestrator and Fake Agents
        run: |
          docker compose -f docker-compose.ci.yml up -d --build

      - name: Show running containers
        run: |
          docker compose -f docker-compose.ci.yml ps

      # 4. Ждем, пока оркестратор станет доступен (проверяем health-эндпоинт)
      - name: Wait for Orchestrator to respond
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Orchestrator is healthy and ready!"
              exit 0
            fi
            echo "Waiting for orchestrator..."
            sleep 2
          done
          
          echo "Orchestrator did not become healthy in time"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      # 5. Устанавливаем пакеты в сам runner GitHub Actions, чтобы запустить pytest-скрипты тестов
      - name: Install test packages in runner
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install ./rag-platform-orchestrator

      # 6. Запускаем E2E тесты
      - name: Run E2E smoke tests
        run: |
          pytest tests/e2e/orchestrator/smoke/ -v

      # Траблшутинг: выводим логи контейнеров, если тесты упали
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --no-color

      # Очистка ресурсов после выполнения джобы
      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
