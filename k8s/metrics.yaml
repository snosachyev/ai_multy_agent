# ==========================================
# 1. ПОСТОЯННЫЕ ДИСКИ (PVC)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ==========================================
# 2. СЕКРЕТЫ ДОСТУПА
# ==========================================
apiVersion: v1
kind: Secret
metadata:
  name: metrics-secrets
type: Opaque
stringData:
  POSTGRES_USER: "rag_user"
  POSTGRES_PASSWORD: "rag_secure_password"
  POSTGRES_DB: "rag_evaluation"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin_secure_password"
---
# ==========================================
# 3. POSTGRESQL (С АВТО-ИНИЦИАЛИЗАЦИЕЙ ТАБЛИЦ)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-metrics
  template:
    metadata:
      labels:
        app: postgres-metrics
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: metrics-secrets
        volumeMounts:
        - name: pg-storage
          mountPath: /var/lib/postgresql/data
        - name: pg-init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: pg-storage
        persistentVolumeClaim:
          claimName: postgres-data-pvc
      - name: pg-init-scripts
        configMap:
          name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-metrics
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-metrics
---
# ==========================================
# 4. PROMETHEUS
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'rag-agents'
        metrics_path: '/metrics'
        static_configs:
          - targets:
            - 'rag-orchestrator:8000'
            - 'rag-director:8001'
            - 'rag-researcher:8002'
            - 'rag-analyst:8003'
            - 'rag-finalizer:8004'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
  selector:
    app: prometheus
---
# ==========================================
# 5. GRAFANA (С ЖЕСТКИМ UID И ДАШБОРДАМИ ИЗ GIT)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: PostgreSQL
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: PostgreSQL
        type: postgres
        uid: ag3sju97zp43kc
        url: postgres-metrics:5432
        user: rag_user
        secureJsonData:
          password: rag_secure_password
        jsonData:
          database: rag_evaluation
          sslmode: 'disable'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: metrics-secrets
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: datasources-volume
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-provider-volume
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards-json-volume
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-data-pvc
      - name: datasources-volume
        configMap:
          name: grafana-datasources
      - name: dashboards-provider-volume
        configMap:
          name: grafana-dashboards-provider
      - name: dashboards-json-volume
        configMap:
          name: grafana-dashboards-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
  selector:
    app: grafana
