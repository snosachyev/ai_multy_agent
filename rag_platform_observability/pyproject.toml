[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-observability"
version = "1.0.0"
description = "Shared observability utilities for RAG Platform"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]