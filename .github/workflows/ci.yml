name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build
        run: |
          pip install build

      - name: Build contracts
        run: |
          python -m build rag-platform-contracts

      - name: Build observability
        run: |
          python -m build rag_platform_observability

      - name: Install contracts
        run: |
          pip install rag-platform-contracts/dist/*.whl

      - name: Install observability
        run: |
          pip install rag_platform_observability/dist/*.whl

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio anyio httpx

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v


  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx

      - name: Build contracts
        run: |
          pip install build
          cd rag-platform-contracts
          python -m build
          cd ..
          cp rag-platform-contracts/dist/*.whl packages/

      - name: Install packages
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install ./rag-platform-researcher

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v


  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx build

      - name: Build contracts
        run: |
          cd rag-platform-contracts
          python -m build
          cd ..
          cp rag-platform-contracts/dist/*.whl packages/

      - name: Build network
        run: |
          docker network create rag-network || true

      - name: Start orchestrator with fake agents
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            up -d \
            --build \
            orchestrator \
            fake-agents

      - name: Show services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            ps

      - name: Wait for orchestrator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Orchestrator did not become healthy"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            logs

          exit 1

      - name: Install application packages
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install ./rag-platform-orchestrator

      - name: Run E2E smoke
        run: |
          pytest tests/e2e/orchestrator/smoke/ -v

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            logs --no-color

      - name: Stop services
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.load-test.yml \
            down -v