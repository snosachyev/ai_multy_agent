name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Глобальные переменные окружения для всех джоб (подхватываются Pydantic-settings)
env:
  PORT: "8000"
  PROVIDER: "mock-provider"
  LLM_MODEL: "mock-model"

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build
        run: |
          pip install build

      # Последовательно собираем все пакеты, чтобы conftest.py их гарантированно видел
      - name: Build contracts
        run: |
          python -m build rag-platform-contracts

      - name: Build observability
        run: |
          python -m build rag-platform-observability

      - name: Build orchestrator
        run: |
          python -m build rag-platform-orchestrator

      - name: Install contracts
        run: |
          pip install rag-platform-contracts/dist/*.whl

      - name: Install observability
        run: |
          pip install rag-platform-observability/dist/*.whl

      - name: Install orchestrator
        run: |
          pip install rag-platform-orchestrator/dist/*.whl

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio anyio httpx

      - name: Install project and test dependencies from requirements.txt
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v


  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx

      - name: Build contracts
        run: |
          pip install build
          cd rag-platform-contracts
          python -m build
          cd ..
          mkdir -p packages
          cp rag-platform-contracts/dist/*.whl packages/

      - name: Install packages
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install packages/rag_platform_orchestrator-*.whl
          pip install ./rag-platform-researcher
      
      - name: Install project and test dependencies from requirements.txt
        run: |
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v


  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: integration-tests # Запускаем E2E только после прохождения интеграционных тестов

    env:
      ORCHESTRATOR_HOST_PORT: "8000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx build

      # 1. Подготавливаем .whl пакеты для мок-контейнера fake-agents
      - name: Build local packages for mock container
        run: |
          mkdir -p packages
          python -m build rag-platform-contracts
          cp rag-platform-contracts/dist/*.whl packages/
          python -m build rag-platform-observability
          cp rag-platform-observability/dist/*.whl packages/

      # 2. Создаем временный файл .env на диске runner-сервера, так как compose ci ссылается на него
      - name: Create environment files
        run: |
          echo "ORCHESTRATOR_HOST_PORT=8000" >> .env
          echo "PORT=8000" >> .env
          echo "PROVIDER=mock-provider" >> .env
          echo "LLM_MODEL=mock-model" >> .env
          
          mkdir -p rag-platform-orchestrator
          echo "PORT=8000" >> ./rag-platform-orchestrator/.env

      # 3. Классическая последовательная сборка образов через Docker CLI хоста
      - name: Build transformer-base image
        run: |
          docker build \
            -t transformer-base:latest \
            -f ./docker/transformer-base.Dockerfile .

      - name: Build rag-python-base image
        run: |
          docker build \
            -t rag-python-base:latest \
            -f ./docker/rag-python-base.Dockerfile .

      # 4. Запускаем Docker Compose. Он автоматически найдет локальный rag-python-base и соберет оркестратор
      - name: Start Orchestrator and Fake Agents
        run: |
          docker compose -f docker-compose.ci.yml up -d --build

      - name: Show running containers
        run: |
          docker compose -f docker-compose.ci.yml ps

      # 5. Ждем готовности оркестратора (healthcheck) перед запуском тестов
      - name: Wait for Orchestrator to respond
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Orchestrator is healthy and ready!"
              exit 0
            fi
            echo "Waiting for orchestrator..."
            sleep 2
          done
          echo "Orchestrator did not become healthy in time"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      # 6. Устанавливаем пакеты в окружение раннера, чтобы pytest мог запустить e2e скрипты
      - name: Install test packages in runner
        run: |
          pip install packages/rag_platform_contracts-*.whl
          pip install packages/rag_platform_observability-*.whl
          pip install ./rag-platform-orchestrator

      # 7. Запускаем E2E сценарии
      - name: Run E2E smoke tests
        run: |
          pytest tests/e2e/orchestrator/smoke/ -v

      # Траблшутинг: выводим логи контейнеров, только если тесты завалились
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --no-color

      # Полная очистка поднятых Docker-ресурсов в любом случае
      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
