[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_platform_llm"
version = "1.0.0"
description = "LLM Providers"
requires-python = ">=3.11"

dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-ollama",
]

[tool.setuptools.packages.find]
where = ["src"]