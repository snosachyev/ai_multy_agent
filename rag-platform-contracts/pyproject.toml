[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-contracts"
version = "1.0.0"
description = "Shared contracts for RAG Platform"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.8,<3",
]

[tool.setuptools.packages.find]
where = ["src"]