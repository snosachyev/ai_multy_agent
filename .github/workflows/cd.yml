
name: CD Full (Build & Deploy)

on:
  workflow_run:
    workflows: ["CI Full"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: snosachyev
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Получаем wheel из CI либо собираем их при ручном запуске CD
  prepare-wheels:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheels from successful CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade build
          rm -rf packages
          mkdir -p packages

          for pkg in \
            rag-platform-contracts \
            rag-platform-observability \
            rag-platform-llm \
            rag-platform-orchestrator \
            rag-platform-researcher \
            rag-platform-analyst \
            rag-platform-director \
            rag-platform-finalizer
          do
            echo "Building $pkg..."
            python -m build "$pkg"
            cp "$pkg"/dist/*.whl packages/
          done

      - name: Verify wheels
        run: |
          echo "Built/downloaded wheels:"
          ls -lh packages/*.whl

      - name: Upload wheels for image builds
        uses: actions/upload-artifact@v4
        with:
          name: cd-python-packages
          path: packages/*.whl
          if-no-files-found: error
          retention-days: 1

  # Сборка и публикация Docker-образов
  build-and-push:
    needs: prepare-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: rag-platform-orchestrator
            image: rag-platform-orchestrator
            target: runtime

          - dir: rag-platform-director
            image: rag-director
            target: ""

          - dir: rag-platform-researcher
            image: rag-researcher
            target: runtime

          - dir: rag-platform-analyst
            image: rag-analyst
            target: ""

          - dir: rag-platform-finalizer
            image: rag-finalizer
            target: ""

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Download Python wheels
        uses: actions/download-artifact@v4
        with:
          name: cd-python-packages
          path: packages

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Деплой в Kubernetes — только если настроен KUBECONFIG_BASE64
  deploy-full:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}

    steps:
      - name: Skip deployment when Kubernetes is not configured
        if: env.KUBECONFIG_BASE64 == ''
        run: echo "KUBECONFIG_BASE64 is not configured. Images were pushed; deployment skipped."

      - name: Checkout exact commit
        if: env.KUBECONFIG_BASE64 != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Kubectl
        if: env.KUBECONFIG_BASE64 != ''
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes Context
        if: env.KUBECONFIG_BASE64 != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Exact Commit Images to K8s
        if: env.KUBECONFIG_BASE64 != ''
        run: |
          chmod +x deploy.sh
          ./deploy.sh prod

          kubectl set image deployment/rag-orchestrator \
            orchestrator=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rag-platform-orchestrator:${{ env.IMAGE_TAG }}

          kubectl set image deployment/rag-director \
            director=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rag-director:${{ env.IMAGE_TAG }}

          kubectl set image deployment/rag-researcher \
            researcher=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rag-researcher:${{ env.IMAGE_TAG }}

          kubectl set image deployment/rag-analyst \
            analyst=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rag-analyst:${{ env.IMAGE_TAG }}

          kubectl set image deployment/rag-finalizer \
            finalizer=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rag-finalizer:${{ env.IMAGE_TAG }}

          kubectl rollout status deployment/rag-orchestrator --timeout=180s
          kubectl rollout status deployment/rag-director --timeout=180s
          kubectl rollout status deployment/rag-researcher --timeout=180s
          kubectl rollout status deployment/rag-analyst --timeout=180s
          kubectl rollout status deployment/rag-finalizer --timeout=180s
