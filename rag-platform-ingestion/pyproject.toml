[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-ingestion"
version = "1.0.0"
description = "Ingestion data"
requires-python = ">=3.11"

dependencies = [
    "rag-platform-contracts==1.0.0",
    "langchain-core",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]
